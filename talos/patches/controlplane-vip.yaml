# Applied with:
#   talosctl patch mc --nodes <cp> --mode=auto --patch @talos/patches/controlplane-vip.yaml
# Interface is Proxmox virtio (ens18). API VIP only. Do not set
# cluster.controlPlane.endpoint here (v1.14 KubeClusterConfig owns it).
machine:
  network:
    interfaces:
      - interface: ens18
        dhcp: true
        vip:
          ip: 172.16.30.10
