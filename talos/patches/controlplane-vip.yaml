# Applied with:
#   talosctl patch mc --nodes <cp> --mode=auto --patch @talos/patches/controlplane-vip.yaml
# Interface is Proxmox virtio (ens18). VIP is API only; ingress is MetalLB .11.
machine:
  network:
    interfaces:
      - interface: ens18
        dhcp: true
        vip:
          ip: 172.16.30.10
cluster:
  controlPlane:
    endpoint: https://172.16.30.10:6443
