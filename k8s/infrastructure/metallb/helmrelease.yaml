apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.*"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 10m0s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
    timeout: 10m0s
  values:
    # L2 ARP only. Chart default frrk8s is BGP and extra RAM we do not want.
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
      tolerateMaster: false
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi
    controller:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi
