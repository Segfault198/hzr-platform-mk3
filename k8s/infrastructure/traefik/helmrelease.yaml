apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "34.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 5
    timeout: 15m0s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m0s
  values:
    # Lab: no cloud LB. Host network — container port *is* the host port.
    # Chart default web=8000; set port 80/443 for LAN.
    deployment:
      replicas: 1
    hostNetwork: true
    # Non-root + hostNetwork :80 needs NET_BIND_SERVICE (Talos denies bind otherwise).
    securityContext:
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    service:
      type: ClusterIP
    ports:
      web:
        port: 80
        expose:
          default: true
      websecure:
        port: 443
        expose:
          default: true
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
