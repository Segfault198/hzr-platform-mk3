apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "34.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 5
    timeout: 15m0s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m0s
  values:
    # Ingress VIP via MetalLB L2 (172.16.30.11). Not hostNetwork.
    deployment:
      replicas: 1
    hostNetwork: false
    service:
      type: LoadBalancer
      spec:
        loadBalancerIP: 172.16.30.11
        externalTrafficPolicy: Local
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
