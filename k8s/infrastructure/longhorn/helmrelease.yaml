apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.7.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 5
    timeout: 15m0s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m0s
  values:
    # Standard kubelet path (Talos). Do not use the K3s rancher path.
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultSettings:
      # Chart keys (not replicaCount). 2 workers → 2 replicas.
      defaultReplicaCount: 2
      defaultDataPath: /var/lib/longhorn
      createDefaultDiskLabeledNodes: true
      allowVolumeCreationWithDegradedAvailability: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
    service:
      ui:
        type: ClusterIP
