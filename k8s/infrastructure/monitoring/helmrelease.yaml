apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 20m0s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
    timeout: 20m0s
  values:
    # 4 GiB workers: no Alertmanager, no control-plane scrapes Talos does not expose.
    alertmanager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 3d
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-lab
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
        nodeSelector:
          kubernetes.io/hostname: hzr-w-2
    grafana:
      adminUser: admin
      adminPassword: lab
      persistence:
        enabled: true
        storageClassName: longhorn-lab
        size: 2Gi
      nodeSelector:
        kubernetes.io/hostname: hzr-w-2
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
