apiVersion: v1
kind: Namespace
metadata:
  name: lab-probe
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lh-probe
  namespace: lab-probe
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-lab
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lh-probe
  namespace: lab-probe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lh-probe
  template:
    metadata:
      labels:
        app: lh-probe
    spec:
      # Pin to w-1 so remount reboot does not take Traefik/monitor off w-2.
      nodeSelector:
        kubernetes.io/hostname: hzr-w-1
      containers:
        - name: probe
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "start $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /data/marker
              while true; do
                echo "beat $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /data/heartbeat
                sleep 10
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lh-probe
