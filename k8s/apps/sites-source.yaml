apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: hzr-sites
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Segfault198/hzr-sites.git
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hzr-sites
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/lab
  prune: true
  sourceRef:
    kind: GitRepository
    name: hzr-sites
  targetNamespace: hzr-sites
  dependsOn:
    - name: infrastructure
      namespace: flux-system
