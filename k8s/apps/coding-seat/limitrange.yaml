# 6 GiB workers, pin hzr-w-2. Max 2Gi; default 512Mi for unmarked pods.
apiVersion: v1
kind: LimitRange
metadata:
  name: crucible
  namespace: coding-seat
spec:
  limits:
    - type: Container
      max:
        memory: 2Gi
      default:
        memory: 512Mi
      defaultRequest:
        memory: 256Mi
        cpu: 50m
